<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmácia Cavallaro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Farmácia Cavallaro</h1>
    <hr>
    <p><em>Preencha os dados do pedido</em></p>

    <!--Farmácia — Simulação de Parcelamento
    -Depois de calcular o total do pedido com desconto, acrescente um laço de repetição
     que mostre o valor em até 6 opções de parcelamento (1x a 6x)
    -dividindo o total já com desconto pela quantidade de parcelas
    -fazer duas versões do mesmo cálculo: uma usando for e outra usando while
    -->

    <form action="calcular.php" method="post">
        <p>
            <label for="tnome">Nome:</label>
            <input type="text" name="tnome" id="tnome" required>
        </p>
        <p>
            <label for="ttotal">Total do pedido:</label>
            <input type="number" step="any" name="ttotal" id="ttotal" required min="0">
        </p>
        <p>
            <label>Faixa etária:</label><br>
            <input type="radio" name="tfaixa" id="menor50" value="menor50" required>
            <label for="menor50">Menor de 50</label><br>
            <input type="radio" name="tfaixa" id="51a70" value="51a70">
            <label for="51a70">51 a 70</label><br>
            <input type="radio" name="tfaixa" id="maior70" value="maior70">
            <label for="maior70">Maior de 70</label>
        </p>
        <p>
            <input type="checkbox" name="tcartao" id="tcartao" value="sim">
            <label for="tcartao">Possui cartão fidelidade</label>
        </p>
        <p>
            <input type="submit" value="Calcular">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
